spring.application.name=ms-doacoes

spring.flyway.enabled=false
spring.profiles.active=test
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

resilience4j.circuitbreaker.instances.ativarEstabelecimento.slidingWindowSize=3
resilience4j.circuitbreaker.instances.ativarEstabelecimento.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.ativarEstabelecimento.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.ativarEstabelecimento.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ativarEstabelecimento.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.ativarEstabelecimento.permittedNumberOfCallsInHalfOpenState=2


resilience4j.circuitbreaker.instances.ativarEstabelecimento.ignoreExceptions[0]=com.github.s0phs.ms_doacoes.exceptions.ResourceNotFoundException
resilience4j.circuitbreaker.instances.ativarEstabelecimento.ignoreExceptions[1]=com.github.s0phs.ms_doacoes.exceptions.BusinessException